name: CI

on:
  push:
  pull_request:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure
      run: cmake -B build

    - name: Build
      run: cmake --build build --parallel

    - name: Run teste10
      run: ./build/urisc test/teste10

    - name: Run teste14
      run: ./build/urisc test/teste14

    - name: Run teste61
      run: ./build/urisc test/teste61
